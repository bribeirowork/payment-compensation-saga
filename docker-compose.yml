name: saga-payment-invoice

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sistemas "que não são seus": SEFAZ e gateway de pagamento (PSP), simulados.
  external-simulators:
    build: ./external-simulators
    container_name: external-simulators
    ports:
      - "8090:8090"
    environment:
      # Prazo legal de cancelamento da NF-e. Reduza (ex.: PT30S) para ver o cancelamento extemporâneo.
      SIMULATOR_SEFAZ_CANCELLATION_DEADLINE: PT24H

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PSP_URL: http://external-simulators:8090/psp
      # No artigo: "se a captura não confirmar em 20h, cancele a NF-e". Aqui encurtado para a demo.
      CHECKOUT_CAPTURE_DEADLINE: PT60S
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Caso 4: publica cada evento DUAS vezes (simula redelivery após rebalance).
      OUTBOX_SIMULATE_DUPLICATE_DELIVERY: "true"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  fiscal-document-gateway:
    build: ./fiscal-document-gateway
    container_name: fiscal-document-gateway
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fiscal
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEFAZ_URL: http://external-simulators:8090/sefaz
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
